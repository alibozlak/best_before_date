spring.application.name=bbd

# --- DATABASE CONNECTION (DOCKER NETWORK) ---
# It gets connection values from the .env file
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HIBERNATE AND JPA SETTINGS ---
# We use 'validate'. It checks tables but does not change them.
# This is safe for our database migration.
spring.jpa.hibernate.ddl-auto=validate

# Performance settings for production
# We do not show SQL logs because they make the system slow.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- SECURITY AND JWT ---
# Secret key for security tokens
jwt.secret=${JWT_SECRET_KEY}

# --- LOGGING SETTINGS ---
logging.file.name=logs/bbd-tracker.log
logging.level.dev.bozlak.bbd=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# --- LOG ROTATION ---
# These settings keep log files small to save disk space.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB